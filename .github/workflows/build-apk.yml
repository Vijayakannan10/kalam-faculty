name: Build Kalam Faculty APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Create Android files
        run: flutter create --platforms=android --org in.kalamfinder --project-name kalam_faculty .

      - name: Add Bluetooth permissions and settings
        run: python3 tool/patch_android.py

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kalam-faculty-apk
          path: build/app/outputs/flutter-apk/app-release.apk

name: Build Kalam Faculty APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Create Android files
        run: flutter create --platforms=android --org in.kalamfinder --project-name kalam_faculty .

      - name: Add Bluetooth permissions and settings
        run: python3 tool/patch_android.py

      - name: Get packages
        run: flutter pub get 2>&1 | tee pub.log

      - name: Build Kalam Faculty
        run: |
          flutter build apk --release -t lib/main_faculty.dart 2>&1 | tee build.log
          cp build/app/outputs/flutter-apk/app-release.apk kalam-faculty.apk
          cp kalam-faculty.apk app-release.apk

      - name: Build Kalam Student
        run: |
          python3 tool/patch_android.py student
          flutter build apk --release -t lib/main_student.dart 2>&1 | tee -a build.log
          cp build/app/outputs/flutter-apk/app-release.apk kalam-student.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kalam-apps
          path: |
            kalam-faculty.apk
            kalam-student.apk

      - name: Publish APK as a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kalam Faculty ${{ github.run_number }}
          make_latest: true
          files: |
            kalam-faculty.apk
            kalam-student.apk
            app-release.apk

      - name: Publish the error log if the build fails
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log-${{ github.run_number }}
          name: Build log ${{ github.run_number }} (failed)
          prerelease: true
          make_latest: false
          files: |
            build.log
            pub.log

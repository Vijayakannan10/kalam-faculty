name: kalam_faculty
description: Kalam Finder faculty app. Updates the faculty member's room automatically using ESP32 room beacons.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: 3.6.0
  cloud_firestore: 5.4.4
  flutter_blue_plus: 1.32.12
  permission_handler: 11.3.1
  shared_preferences: 2.3.2
  wakelock_plus: 1.2.8

flutter:
  uses-material-design: true
